name: 功能请求
description: 建议一个新功能或改进
title: '[Feature] '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        提之前请先读 [KNOWN-ISSUES.md](../blob/main/KNOWN-ISSUES.md) 的「刻意不做」
        一节 —— 有些东西是**有意**不做的（例如不隔离副机文件系统、不限制
        `exec` 能跑的命令），提之前值得看下理由。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景，再说方案。方案可以留空。
      placeholder: |
        我经常需要 ___，但现在得 ___，很麻烦。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案（可选）
      description: 如果有具体想法，写在这里
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案（可选）
      description: 为什么它们不够好？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一块
      options:
        - 主机侧（hub）：工具 / 面板 / 节点管理
        - 副机侧（worker）：任务引擎 / 执行后端 / 产物
        - 传输（direct / relay）
        - 部署（profiles / 中继脚本）
        - 文档
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: invariants
    attributes:
      label: 是否会破坏现有不变式
      description: |
        本插件有四条设计不变式（见 README）。如果你的方案会动到它们，请说明为什么值得。
      options:
        - label: 凭证不离开副机（协议里不带模型 key）
        - label: 断连不终止任务（任务在副机本地持久运行）
        - label: 清单先于字节（成品要显式 pull 才传输）
        - label: 只有 role:final 过河（中间产物留在副机）
        - label: 以上都不涉及 / 不确定
