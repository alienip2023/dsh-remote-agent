# dsh-remote-relay 的 TLS 前置模板（nginx）
#
# 安装：sudo cp nginx.conf /etc/nginx/sites-available/dsh-relay
#       sudo ln -s /etc/nginx/sites-available/dsh-relay /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 与 Caddyfile 模板二选一。nginx 不会自动签证书，<证书路径> 用你自己的
# （certbot / 云厂商证书均可）。

upstream dsh_relay {
	server 127.0.0.1:8890;
	keepalive 4;
}

server {
	listen 443 ssl;
	http2 on;
	server_name relay.example.com;

	ssl_certificate     /etc/ssl/certs/relay.example.com.fullchain.pem;
	ssl_certificate_key /etc/ssl/private/relay.example.com.key;
	ssl_protocols TLSv1.2 TLSv1.3;

	# 中继是长连接 WS 转发，读超时必须放宽：副机空闲时也可能几分钟
	# 没有业务帧（中继自己的 ping/pong 保活，见 lib/relay.js）。
	proxy_read_timeout  1h;
	proxy_send_timeout  1h;

	location / {
		proxy_pass http://dsh_relay;

		# ── WebSocket 三件套（缺一不可） ──
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

# HTTP 一律跳 HTTPS（ACME challenge 若要走 80 需另行放行）
server {
	listen 80;
	server_name relay.example.com;
	return 301 https://$host$request_uri;
}
