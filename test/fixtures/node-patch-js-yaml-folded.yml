- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    maxTokens: 384000
    defaultContextWindow: 1000000
    streamIdleTimeoutMs: 300000
    models:
      - id: "deepseek-flash"
        name: "DeepSeek-V4.1-Flash"
        contextWindow: 1000000
        inputModalities:
          - "text"
          - "image"
        systemPromptUpdate: "in-history"
        toolUpdate: "addition-only"
      - id: "deepseek-v4-pro"
        name: "DeepSeek-V4-Pro"
        description: "Stronger agentic coding, knowledge, and difficult reasoning;
          suited to complex or quality-critical tasks at higher cost."
        contextWindow: 1000000
        inputModalities:
          - "text"

# ── N-2 探针（2026-11-10）──────────────────────────────────────────────────
# 无 agent preset 的宿主层上重新启用核心工具；并把默认权限钉成无人值守预设。
# permission 行：补丁替换整段 config，故必须重述 read-only / workspace-write /
# danger-full-access 三项，再加 node-unattended。回滚见
# cordis.patch.yml.bak-n2-20261110（sha256 31b596a79e3bc210d32ec9a46a54b9278636e26be6b14139dda706cf427860b0）。
- id: tool-bash
  disabled: false

- id: tool-jobs
  disabled: false

- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false
  config:
    sampleOverCapGlobResults: false

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      node-unattended:
        sandbox: workspace-write
        approval: never
    defaultPreset: node-unattended
