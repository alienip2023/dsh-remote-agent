# 副机（worker）补丁层：只保留 remote-agent 一条，其余沿用 bundle 默认。
- id: remote-agent
  name: dsh-remote-agent
  inject: [ 'tools', 'agentLoop', 'sessions' ]
  config:
    role: worker
    transportMode: relay
    relayUrl: 'ws://relay.example:8890/relay'
    nodeId: dshtest-1
    roots: [ '/root/work' ]
    agentMode: true

# 2026-11-08 司令诊断：DSH 0.2.2-alpha.2 的 agent-preset-registry 与 cordis 4.0.6-alpha.2 不兼容
# （leakedServices 读 impl.fiber，实际 impl 只有 ctx.fiber）→ 任何 session 创建都抛 parent TypeError。
# worker 无头运行 Bot，不需要 agent preset，关掉让 composeAgent 走无 preset 分支。
- id: agent-preset-registry
  disabled: true

